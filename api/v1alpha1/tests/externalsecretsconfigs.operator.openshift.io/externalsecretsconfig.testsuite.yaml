apiVersion: apiextensions.k8s.io/v1
name: "ExternalSecretsConfig"
crdName: externalsecretsconfigs.operator.openshift.io
tests:
  onCreate:
    - name: Should be able to create a minimal ExternalSecretsConfig
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec: {}
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec: {}

    - name: Should reject ExternalSecretsConfig with name other than cluster
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: not-cluster
        spec: {}
      expectedError: "ExternalSecretsConfig is a singleton, .metadata.name must be 'cluster'"

    - name: Should accept ExternalSecretsConfig with valid custom annotations
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: example.com/custom-annotation
                value: my-value
              - key: mycompany.io/another-annotation
                value: another-value
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: example.com/custom-annotation
                value: my-value
              - key: mycompany.io/another-annotation
                value: another-value

    - name: Should reject annotations with kubernetes.io prefix
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: kubernetes.io/forbidden
                value: test
      expectedError: "annotations with reserved prefixes 'kubernetes.io/', 'app.kubernetes.io/', 'openshift.io/', 'k8s.io/' are not allowed"

    - name: Should reject annotations with app.kubernetes.io prefix
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: app.kubernetes.io/managed-by
                value: test
      expectedError: "annotations with reserved prefixes 'kubernetes.io/', 'app.kubernetes.io/', 'openshift.io/', 'k8s.io/' are not allowed"

    - name: Should reject annotations with openshift.io prefix
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: openshift.io/forbidden
                value: test
      expectedError: "annotations with reserved prefixes 'kubernetes.io/', 'app.kubernetes.io/', 'openshift.io/', 'k8s.io/' are not allowed"

    - name: Should reject annotations with k8s.io prefix
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: k8s.io/forbidden
                value: test
      expectedError: "annotations with reserved prefixes 'kubernetes.io/', 'app.kubernetes.io/', 'openshift.io/', 'k8s.io/' are not allowed"

    - name: Should accept componentConfig with ExternalSecretsCoreController
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 5
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 5

    - name: Should accept componentConfig with Webhook
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: Webhook
                deploymentConfig:
                  revisionHistoryLimit: 3
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: Webhook
                deploymentConfig:
                  revisionHistoryLimit: 3

    - name: Should accept componentConfig with CertController
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: CertController
                deploymentConfig:
                  revisionHistoryLimit: 2
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: CertController
                deploymentConfig:
                  revisionHistoryLimit: 2

    - name: Should accept componentConfig with BitwardenSDKServer
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: BitwardenSDKServer
                deploymentConfig:
                  revisionHistoryLimit: 1
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: BitwardenSDKServer
                deploymentConfig:
                  revisionHistoryLimit: 1

    - name: Should reject componentConfig with invalid componentName
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: InvalidComponent
                deploymentConfig:
                  revisionHistoryLimit: 5
      expectedError: "Unsupported value"

    - name: Should reject duplicate componentName in componentConfig
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 5
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 10
      expectedError: "componentName must be unique across all componentConfig entries"

    - name: Should reject revisionHistoryLimit less than 1
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 0
      expectedError: "must be greater than or equal to 1"

    - name: Should accept valid overrideEnv with custom environment variables
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                overrideEnv:
                  - name: GOMAXPROCS
                    value: "4"
                  - name: MY_CUSTOM_VAR
                    value: custom-value
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                overrideEnv:
                  - name: GOMAXPROCS
                    value: "4"
                  - name: MY_CUSTOM_VAR
                    value: custom-value

    - name: Should reject overrideEnv with HOSTNAME prefix
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                overrideEnv:
                  - name: HOSTNAME
                    value: forbidden
      expectedError: "Environment variable names with reserved prefixes 'HOSTNAME', 'KUBERNETES_', 'EXTERNAL_SECRETS_' are not allowed"

    - name: Should reject overrideEnv with KUBERNETES_ prefix
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                overrideEnv:
                  - name: KUBERNETES_SERVICE_HOST
                    value: forbidden
      expectedError: "Environment variable names with reserved prefixes 'HOSTNAME', 'KUBERNETES_', 'EXTERNAL_SECRETS_' are not allowed"

    - name: Should reject overrideEnv with EXTERNAL_SECRETS_ prefix
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                overrideEnv:
                  - name: EXTERNAL_SECRETS_CONFIG
                    value: forbidden
      expectedError: "Environment variable names with reserved prefixes 'HOSTNAME', 'KUBERNETES_', 'EXTERNAL_SECRETS_' are not allowed"

    - name: Should accept combined annotations and componentConfig
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: example.com/annotation
                value: test-value
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 10
                overrideEnv:
                  - name: GOMAXPROCS
                    value: "4"
              - componentName: Webhook
                deploymentConfig:
                  revisionHistoryLimit: 3
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: example.com/annotation
                value: test-value
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 10
                overrideEnv:
                  - name: GOMAXPROCS
                    value: "4"
              - componentName: Webhook
                deploymentConfig:
                  revisionHistoryLimit: 3

    - name: Should accept componentConfig with all four components
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 10
              - componentName: Webhook
                deploymentConfig:
                  revisionHistoryLimit: 5
              - componentName: CertController
                deploymentConfig:
                  revisionHistoryLimit: 3
              - componentName: BitwardenSDKServer
                deploymentConfig:
                  revisionHistoryLimit: 2
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 10
              - componentName: Webhook
                deploymentConfig:
                  revisionHistoryLimit: 5
              - componentName: CertController
                deploymentConfig:
                  revisionHistoryLimit: 3
              - componentName: BitwardenSDKServer
                deploymentConfig:
                  revisionHistoryLimit: 2

  onUpdate:
    - name: Should allow updating annotations
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: example.com/annotation
                value: old-value
      updated: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: example.com/annotation
                value: new-value
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            annotations:
              - key: example.com/annotation
                value: new-value

    - name: Should allow updating revisionHistoryLimit
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 5
      updated: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 10
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 10

    - name: Should allow updating overrideEnv
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                overrideEnv:
                  - name: GOMAXPROCS
                    value: "4"
      updated: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                overrideEnv:
                  - name: GOMAXPROCS
                    value: "8"
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                overrideEnv:
                  - name: GOMAXPROCS
                    value: "8"

    - name: Should allow adding new componentConfig entry
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 5
      updated: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 5
              - componentName: Webhook
                deploymentConfig:
                  revisionHistoryLimit: 3
      expected: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 5
              - componentName: Webhook
                deploymentConfig:
                  revisionHistoryLimit: 3

    - name: Should reject update with duplicate componentName
      initial: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 5
      updated: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec:
          controllerConfig:
            componentConfig:
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 5
              - componentName: ExternalSecretsCoreController
                deploymentConfig:
                  revisionHistoryLimit: 10
      expectedError: "componentName must be unique across all componentConfig entries"
